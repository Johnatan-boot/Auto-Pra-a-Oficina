    <main>
      <div class="container-sm">
        <div class="container text-center">
          <div class="row">
            <div class="col-12">
              <form id="contactForm">
                <h2 class="h2_orcamentos">Orçamento</h2>
                <div id="card-container" class="card">
                  <div class="card-body">
                    <div class="row">
                      <div class="container-dadosPessoais">
                        <div class="boxcontent">
                          <div class="row">
                            <label for="name">Nome:</label>
                            <input
                              class="inputName"
                              type="text"
                              id="name"
                              name="name"
                              required
                            />
                          </div>

                          <div class="row">
                            <label for="email">Email:</label>
                            <input
                              class="inputEmail"
                              type="email"
                              id="email"
                              name="email"
                              required
                            />
                          </div>
                          <div class="row">
                            <label for="fone">Telefone:</label>
                            <input
                              class="inputFone"
                              type="fone"
                              id="fone"
                              name="fone"
                              required
                            />
                          </div>
                        </div>
                      </div>
                    </div>
                  </div>
                </div>

                <div id="card-container" class="card">
                  <div class="card-body">
                    <div class="row">
                      <div class="containeroptionservice">
                        <div class="row">
                          <span class="span_service_execute"
                            >Serviço a ser executado:</span
                          >
                        </div>
                        <div class="form-check">
                          <input
                            class="form-check-input"
                            type="radio"
                            name="flexRadioDefault"
                            id="flexRadioDefault1"
                          />
                          <label
                            class="form-check-label"
                            for="flexRadioDefault1"
                          >
                            Pintura Econômica
                          </label>
                        </div>
                        <div class="form-check">
                          <input
                            class="form-check-input"
                            type="radio"
                            name="flexRadioDefault"
                            id="flexRadioDefault2"
                            checked
                          />
                          <label
                            class="form-check-label"
                            for="flexRadioDefault2"
                          >
                            Pintura Standard
                          </label>
                        </div>
                        <div class="form-check">
                          <input
                            class="form-check-input"
                            type="radio"
                            name="flexRadioDefault"
                            id="flexRadioDefault2"
                            checked
                          />
                          <label
                            class="form-check-label"
                            for="flexRadioDefault2"
                          >
                            Pintura Premium
                          </label>
                        </div>

                        <select
                          class="form-select"
                          aria-label="Default select example"
                        >
                          <option selected>Abra a seleção do menu</option>
                          <option value="1">Teto</option>
                          <option value="2">Capoo</option>
                          <option value="3">Porta</option>
                          <option value="4">Lateral</option>
                          <option value="5">Tampa traseira</option>
                          <option value="6">Parachoque</option>
                        </select>
                      </div>
                    </div>
                  </div>
                </div>

                <div id="card-container" class="card">
                  <div class="card-body">
                    <div class="row">
                      <label for="message">Descrição do Sinistro:</label>
                    </div>
                    <textarea id="message" name="message" required></textarea>

                    <div class="row">
                      <button class="btn btn-submit" type="submit">
                        Enviar
                      </button>
                    </div>
                  </div>
                </div>
              </form>
            </div>
          </div>
        </div>
      </div>
    </main>
